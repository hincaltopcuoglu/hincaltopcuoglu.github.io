<div class="search-modal" id="search-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Search posts">
  <div class="search-backdrop" data-search-close></div>

  <div class="search-panel" role="document">
    <div class="search-field">
      <i class="fas fa-search" aria-hidden="true"></i>
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="Search posts, topics, tags…"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search posts"
        aria-controls="search-results"
        aria-describedby="search-hint" />
      <button type="button" class="search-close" data-search-close aria-label="Close search">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>

    <p class="search-hint" id="search-hint">
      <kbd>↑</kbd><kbd>↓</kbd> to navigate · <kbd>Enter</kbd> to open · <kbd>Esc</kbd> to close
    </p>

    <ul class="search-results" id="search-results" role="listbox" aria-label="Search results"></ul>

    <p class="search-empty" id="search-empty" hidden>No matches. Try a different keyword.</p>
  </div>
</div>
