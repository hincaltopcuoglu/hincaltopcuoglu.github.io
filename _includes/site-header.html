<header class="site-header">
  <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>

  <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <nav class="site-nav" id="site-nav" aria-label="Primary">
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active" aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/cv/' | relative_url }}" {% if page.url contains '/cv' %}class="active" aria-current="page"{% endif %}>CV</a>
    <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="active" aria-current="page"{% endif %}>Blog</a>
    <a href="mailto:{{ site.email }}">Contact</a>

    <button type="button" class="search-trigger" id="search-trigger" aria-label="Search posts (press / )">
      <i class="fas fa-search" aria-hidden="true"></i>
      <kbd class="search-kbd">/</kbd>
    </button>

    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <i class="fas fa-moon" aria-hidden="true"></i>
    </button>
  </nav>
</header>
