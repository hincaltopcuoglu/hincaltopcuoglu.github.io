<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ page.title }} - {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  {% include google-analytics.html %}
</head>

<body>
  <header>
    <nav>
      <ul>
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/cv/' | relative_url }}">CV</a></li>
        <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
      </ul>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>© 2025 Hincal Topcuoglu. Powered by Jekyll.</p>
  </footer>

  <!-- Custom behavioral tracking -->
  <script>
    const scrollMilestones = [25, 50, 75, 90];
    const scrollFired = {};

    window.addEventListener('scroll', function() {
      const docHeight = document.body.scrollHeight - window.innerHeight;
      if (docHeight <= 0) return;
      const scrollPercent = Math.round((window.scrollY / docHeight) * 100);
      scrollMilestones.forEach(function(milestone) {
        if (scrollPercent >= milestone && !scrollFired[milestone]) {
          scrollFired[milestone] = true;
          gtag('event', 'scroll_depth', {
            depth_percentage: milestone,
            page_path: window.location.pathname,
            page_title: document.title
          });
        }
      });
    });

    const timeCheckpoints = [15, 30, 60, 120, 300];
    timeCheckpoints.forEach(function(seconds) {
      setTimeout(function() {
        gtag('event', 'time_on_page', {
          seconds_spent: seconds,
          page_path: window.location.pathname,
          page_title: document.title
        });
      }, seconds * 1000);
    });

    document.addEventListener('click', function(e) {
      const target = e.target.closest('a, button');
      if (!target) return;
      const label = (target.innerText || target.textContent || '').trim().substring(0, 100);
      const href = target.getAttribute('href') || '';

      if (href === '/' || href.includes('/cv') || href.includes('/blog')) {
        gtag('event', 'nav_click', { link_text: label, link_url: href, page_path: window.location.pathname });
      }
      if (href.includes('/cv')) gtag('event', 'cv_open', { page_path: window.location.pathname });
      if (href.includes('/blog')) gtag('event', 'blog_open', { page_path: window.location.pathname });

      if (href.startsWith('http') && !href.includes(window.location.hostname)) {
        gtag('event', 'outbound_click', { link_text: label, link_url: href, page_path: window.location.pathname });
        if (href.includes('linkedin.com')) gtag('event', 'linkedin_click', { page_path: window.location.pathname });
        if (href.includes('github.com'))   gtag('event', 'github_click',   { page_path: window.location.pathname });
        if (href.includes('x.com'))        gtag('event', 'x_click',        { page_path: window.location.pathname });
      }
    });

    document.querySelectorAll('section[id]').forEach(function(section) {
      const observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            gtag('event', 'section_view', { section_id: entry.target.id, page_path: window.location.pathname });
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.5 });
      observer.observe(section);
    });
  </script>
</body>
</html>
